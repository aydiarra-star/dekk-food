name: dekk_food
description: Catalogue national des restaurants, fast-foods, gargotes et dibiteries du Sénégal.
publish_to: 'none'
version: 3.0.0+3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  # Contacts et navigation : appel, WhatsApp, e-mail, site, itinéraire.
  url_launcher: ^6.2.6
  # Favoris et contributions conservés hors ligne.
  shared_preferences: ^2.2.3
  # Carte interactive (fond de carte OpenStreetMap).
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  # Base communautaire optionnelle (activable par --dart-define).
  supabase_flutter: ^2.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/catalogue.json
